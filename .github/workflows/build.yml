name: Build EXE and MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install deps
      run: pip install PyQt6 pyinstaller Pillow

    # NORMAL EXE - onedir + ikonlar gömülü
    - name: Build Normal EXE
      run: |
        pyinstaller --onedir --windowed --icon=app_icon.ico --name=JosesoftPhotoViewer `
          --add-data "app_icon.ico;." `
          --add-data "icon.ico;." `
          --add-data "app_icon.png;." `
          --add-data "icon.png;." `
          --add-data "icon_zoom.png;." `
          --add-data "icon_actual.png;." `
          --add-data "icon_prev.png;." `
          --add-data "icon_next.png;." `
          --add-data "icon_center.png;." `
          --add-data "icon_rotleft.png;." `
          --add-data "icon_rotright.png;." `
          --add-data "icon_delete.png;." `
          Photo_Viewer.py

    # STORE EXE - onedir + ikonlar gömülü
    - name: Build Store EXE
      run: |
        pyinstaller --onedir --windowed --icon=app_icon.ico --name=JosesoftPhotoViewer_Store `
          --add-data "app_icon.ico;." `
          --add-data "icon.ico;." `
          --add-data "app_icon.png;." `
          --add-data "icon.png;." `
          --add-data "icon_zoom.png;." `
          --add-data "icon_actual.png;." `
          --add-data "icon_prev.png;." `
          --add-data "icon_next.png;." `
          --add-data "icon_center.png;." `
          --add-data "icon_rotleft.png;." `
          --add-data "icon_rotright.png;." `
          --add-data "icon_delete.png;." `
          Photo_Viewer_Store.py

    # Fallback: Eski yöntemle de kopyala (zararı yok, çift garanti)
    - name: Copy PNG Assets Directly Next to EXE
      shell: pwsh
      run: |
        $files = @("app_icon.ico","icon.ico","app_icon.png","icon.png","icon_zoom.png","icon_actual.png","icon_prev.png","icon_next.png","icon_center.png","icon_rotleft.png","icon_rotright.png","icon_delete.png")
        foreach ($f in $files) {
          if (Test-Path $f) {
            Copy-Item $f dist\JosesoftPhotoViewer\ -Force -ErrorAction SilentlyContinue
            Copy-Item $f dist\JosesoftPhotoViewer_Store\ -Force -ErrorAction SilentlyContinue
            Write-Host "Copied $f"
          } else {
            Write-Host "Missing $f (skip)"
          }
        }
        Write-Host "=== Normal ==="
        Get-ChildItem dist\JosesoftPhotoViewer\
        Write-Host "=== Store ==="
        Get-ChildItem dist\JosesoftPhotoViewer_Store\

    - name: Prepare MSIX
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force msix -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path msix -Force | Out-Null
        New-Item -ItemType Directory -Path msix\Assets -Force | Out-Null
        Copy-Item dist\JosesoftPhotoViewer_Store\* msix\ -Recurse -Force

        python -c "from PIL import Image; im=Image.open('app_icon.ico'); im.resize((44,44)).save('msix/Assets/Square44x44Logo.png'); im.resize((150,150)).save('msix/Assets/Square150x150Logo.png')"

        Copy-Item AppxManifest.xml msix\AppxManifest.xml -Force

    - name: Validate MSIX manifest
      shell: pwsh
      run: |
        $xml = [xml](Get-Content -Raw msix\AppxManifest.xml)
        $root = $xml.DocumentElement
        if ($root.LocalName -ne "Package") { throw "Root element must be Package" }
        if ($root.NamespaceURI -ne "http://schemas.microsoft.com/appx/manifest/foundation/windows10") {
          throw "Invalid manifest namespace: $($root.NamespaceURI)"
        }
        if (-not (Test-Path "msix\JosesoftPhotoViewer_Store.exe")) {
          throw "Executable not found in msix folder"
        }
        # ikonlar msix icinde mi?
        $icons = @("icon_zoom.png","icon_actual.png")
        foreach ($ic in $icons) {
          if (-not (Test-Path "msix\$ic")) { Write-Host "WARNING: $ic not in msix root, but will be found via _MEIPASS if embedded" }
        }

    - name: Build MSIX
      shell: pwsh
      run: |
        $m = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter makeappx.exe | Select-Object -First 1
        Write-Host "makeappx: $($m.FullName)"
        & $m.FullName pack /d msix /p JosesoftPhotoViewer_Store.msix /o /v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-ChildItem *.msix

    - name: Zip Normal EXE
      shell: pwsh
      run: Compress-Archive -Path dist\JosesoftPhotoViewer -DestinationPath JosesoftPhotoViewer.zip -Force

    - name: Upload Standard Zip
      uses: actions/upload-artifact@v4
      with:
        name: JosesoftPhotoViewer-Standard-Zip
        path: JosesoftPhotoViewer.zip

    - name: Upload Store MSIX
      uses: actions/upload-artifact@v4
      with:
        name: JosesoftPhotoViewer-Store-MSIX
        path: JosesoftPhotoViewer_Store.msix
