name: Build EXE and MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install deps
      run: pip install PyQt6 pyinstaller Pillow

    - name: Build Normal (Folder Mode)
      run: pyinstaller --onedir --windowed --icon=app_icon.ico --name=JosesoftPhotoViewer Photo_Viewer.py

    - name: Build Store (Folder Mode)
      run: pyinstaller --onedir --windowed --icon=app_icon.ico --name=JosesoftPhotoViewer_Store Photo_Viewer_Store.py

    - name: Prepare MSIX
      run: |
        mkdir msix
        mkdir msix\Assets
        Copy-Item dist\JosesoftPhotoViewer_Store\* msix\ -Recurse -Force
        python -c "from PIL import Image; im=Image.open('app_icon.ico'); [im.resize((s,s), Image.LANCZOS).save(f'msix/Assets/Square{s}x{s}Logo.png') for s in [44,50,150]]; im.resize((310,150), Image.LANCZOS).save('msix/Assets/Wide310x150Logo.png'); im.resize((50,50), Image.LANCZOS).save('msix/Assets/StoreLogo.png')"
        $content = Get-Content AppxManifest.xml -Raw
        $content = $content.Trim()
        Set-Content -Path msix\AppxManifest.xml -Value $content -Encoding utf8NoBOM

    - name: Build MSIX
      run: |
        $m = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter makeappx.exe | Select -First 1
        & $m.FullName pack /d msix /p JosesoftPhotoViewer_Store.msix /o

    - name: Zip Artifacts
      run: |
        Compress-Archive -Path dist\JosesoftPhotoViewer -DestinationPath JosesoftPhotoViewer.zip -Force
        Compress-Archive -Path dist\JosesoftPhotoViewer_Store -DestinationPath JosesoftPhotoViewer_Store.zip -Force

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Josesoft-Build-Artifacts
        path: |
          JosesoftPhotoViewer.zip
          JosesoftPhotoViewer_Store.zip
          JosesoftPhotoViewer_Store.msix
